plugins { id 'com.android.application' }
android {
    namespace 'com.yeezi.classlive'
    compileSdk 35
    signingConfigs { debug { storeFile rootProject.file('.ci-signing/debug.keystore') } }
    defaultConfig { testInstrumentationRunner 'com.yeezi.classlive.UiRegression'; applicationId 'com.yeezi.classlive.v1'; minSdk 26; targetSdk 35; versionCode 100; versionName '1.0'; ndk { abiFilters 'arm64-v8a' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies { implementation 'com.squareup.okhttp3:okhttp:3.14.9' }
