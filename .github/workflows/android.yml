name: Build ClassLive 1.0
on:
  push:
    branches: [experiment/offline-parakeet, release/classlive-1.0]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;28.2.13676358'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: classlive-v1-debug-signing
      - uses: actions/cache@v4
        id: native
        with:
          path: app/src/main/jniLibs
          key: classlive-native-v1-${{ hashFiles('native/**') }}
      - if: steps.native.outputs.cache-hit != 'true'
        run: CLASSLIVE_ANDROID_NDK="$ANDROID_HOME/ndk/28.2.13676358" bash native/build-android.sh
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest
      - run: python3 test_core.py
      - run: cp app/build/outputs/apk/debug/app-debug.apk ClassLive1.0.apk
      - uses: actions/upload-artifact@v4
        with: { name: ClassLive1.0, path: ClassLive1.0.apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tests/run-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ClassLive1.0-QA
          path: |
            qa/
            app/build/reports/lint-results-debug.html
