name: Build ClassLive Offline APK
on:
  push:
    branches: [experiment/offline-parakeet]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;28.2.13676358'
      - run: CLASSLIVE_ANDROID_NDK="$ANDROID_HOME/ndk/28.2.13676358" bash native/build-android.sh
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle :app:assembleDebug :app:lintDebug
      - run: python3 test_core.py
      - run: cp app/build/outputs/apk/debug/app-debug.apk ClassLive-Offline-0.4.0-arm64.apk
      - uses: actions/upload-artifact@v4
        with: { name: ClassLive-Offline-0.4.0-arm64, path: ClassLive-Offline-0.4.0-arm64.apk }
